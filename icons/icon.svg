    <!-- 수직 줄기 -->
    <rect x="-13" y="-168" width="26" height="368" rx="13" fill="#be123c"/>
    <!-- 상단 컬 + 원형 루프 -->
    <path d="M0,-168 C60,-168 96,-132 96,-88 C96,-44 60,-16 20,-4 C70,8 108,44 108,96 C108,152 66,190 10,190 C-30,190 -60,164 -60,128 C-60,96 -36,76 -10,76 C14,76 34,94 34,114 C34,130 22,140 10,140 C2,140 -4,134 -4,126"
      fill="none" stroke="#be123c" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 하단 컬 -->
    <path d="M0,200 C-44,200 -70,178 -70,152 C-70,126 -46,108 -14,112"
      fill="none" stroke="#be123c" stroke-width="26" stroke-linecap="round"/>
    <!-- 중앙 원 포인트 -->
